<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBFBFD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Argus</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <!-- ── 固定 logo：任何页面点它都回首页。底部 tabbar 去掉后，这是全局唯一的
       「回首页」入口，所以放在最上面、压在所有页面之上。 ── -->
  <button class="toplogo" id="toplogo" type="button" aria-label="回首页">
    <img src="assets/argus-anime.webp" width="1024" height="1024" alt="">
  </button>

  <main class="stage">

    <!-- ── 首页 ── -->
    <section class="view view--center is-active" id="view-home">
      <div class="hero">
        <div class="npc-wrap">
          <img class="npc" src="assets/argus-anime.webp" width="1024" height="1024"
               alt="Argus，一只蹲坐着的奶油色宝可梦">
        </div>
        <p class="greeting" id="greeting"></p>
      </div>
      <!-- ── 首页即导航中枢：底部栏去掉了，各页面从这里进 ── -->
      <nav class="homenav" id="homenav" aria-label="主导航">
            <button class="homenav__item" data-view="chat" type="button">
              <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M9 4.5h10a6 6 0 0 1 6 6v3.5a6 6 0 0 1-6 6h-3.6l-5.4 3.2V20H9a6 6 0 0 1-6-6v-3.5a6 6 0 0 1 6-6Z" fill="currentColor"/>
      </svg>
              <span>Chat</span>
            </button>
            <button class="homenav__item" data-view="resume" type="button">
              <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M7.5 4.5h9.2L22 9.8v13.7a1 1 0 0 1-1 1H7.5a1 1 0 0 1-1-1v-18a1 1 0 0 1 1-1Z"
              stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" opacity=".42"/>
        <path d="M16.4 4.6v4.9a1 1 0 0 0 1 1h4.4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" opacity=".42"/>
        <path d="M10.6 14h7M10.6 17.6h7M10.6 21.2h4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
              <span>Resume</span>
            </button>
            <button class="homenav__item" data-view="jobs" type="button">
              <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M7.5 20.5h13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" opacity=".38"/>
        <circle cx="7.5" cy="20.5" r="3" fill="currentColor"/>
        <circle cx="14" cy="14.5" r="2.6" fill="currentColor" opacity=".62"/>
        <circle cx="20.5" cy="8.5" r="2.2" fill="currentColor" opacity=".32"/>
      </svg>
              <span>Jobs</span>
            </button>
            <button class="homenav__item" data-view="career" type="button">
              <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <circle cx="14" cy="14" r="9.9" stroke="currentColor" stroke-width="1.7" opacity=".28"/>
        <path d="M20.6 7.4 14 14 7.4 20.6 12.6 12.6Z" fill="currentColor" opacity=".45"/>
        <path d="M20.6 7.4 14 14 12.6 12.6Z" fill="currentColor"/>
      </svg>
              <span>Career</span>
            </button>
            <button class="homenav__item" data-view="me" type="button">
              <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <circle cx="14" cy="9.8" r="4.8" fill="currentColor"/>
        <path d="M14 16.6c-4.7 0-8.5 3.2-8.5 7.1v.8h17v-.8c0-3.9-3.8-7.1-8.5-7.1Z" fill="currentColor"/>
      </svg>
              <span>Me</span>
            </button>
      </nav>
    </section>

    <!-- ── Chat：与 Argus 的对话（tabbar 让位给 composer） ── -->
    <section class="view" id="view-chat" hidden>
      <div class="chat">

        <header class="chat__head">
          <img class="chat__avatar" src="assets/argus-anime.webp" alt="">
          <span class="chat__name">Argus</span>
          <button class="chat__clear" id="chat-clear" type="button" aria-label="清空对话上下文">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.5 7h15M9.5 7V5.6A1.6 1.6 0 0 1 11.1 4h1.8a1.6 1.6 0 0 1 1.6 1.6V7M6.8 7l.7 11.3A2 2 0 0 0 9.5 20.1h5a2 2 0 0 0 2-1.8L17.2 7"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </header>

        <div class="msgs" id="msgs"></div>

        <form class="composer" id="composer">
          <p class="composer__chip" id="chip" hidden></p>
          <div class="composer__row">
            <input type="file" id="file" accept=".txt,.md,text/plain,text/markdown" hidden>
            <button class="icon-btn" id="attach" type="button" aria-label="上传 txt 或 md">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 4.8v14.4M4.8 12h14.4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
              </svg>
            </button>
            <textarea class="composer__input" id="input" rows="1" autocomplete="off" placeholder="说说你的经历…"></textarea>
            <button class="icon-btn icon-btn--send" id="send" type="submit" aria-label="发送">
              <!-- 同一颗按钮两副面孔：默认箭头，等模型时换成方块（停止）。两个 svg
                   都在 DOM 里，用 CSS 切换，省掉一次 innerHTML 重绘。 -->
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="icon-btn__send-arrow">
                <path d="M4 12h15M11.5 4.8l7.2 7.2-7.2 7.2" stroke="currentColor" stroke-width="2.6"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="icon-btn__stop">
                <rect x="5.5" y="5.5" width="13" height="13" rx="2.5" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </form>

      </div>
    </section>

    <!-- ── Resume：用户自己的简历（tabbar 在 Chat 和 Jobs 之间） ── -->
    <section class="view view--resume" id="view-resume" hidden>
      <p class="rlist__note">简历是你的，改动只在你亲手保存时发生。AI 只负责追问和评价。</p>
      <div class="rlist" id="resume-list">
        <p class="placeholder__note">加载中…</p>
      </div>
    </section>

    <!-- ── 简历详情：hash 路由 #resume/<career_id> ── -->
    <section class="view view--resumedit" id="view-resumedit" hidden>
      <div class="jdetail">
        <header class="jdetail__head">
          <button class="jdetail__back" id="resume-back" type="button" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <span class="jdetail__htitle" id="resume-htitle">简历</span>
        </header>
        <div class="jdetail__body" id="resume-body"></div>
      </div>
    </section>

    <!-- ── Jobs：持久化的岗位卡片 ── -->
    <section class="view view--jobs" id="view-jobs" hidden>
      <p class="jobs__meta" id="jobs-meta"></p>
      <div class="jobs__grid" id="jobs-grid">
        <p class="placeholder__note">加载中…</p>
      </div>
    </section>

    <!-- ── 岗位详情：卡片点进来，hash 路由 #job/<id> ── -->
    <section class="view view--job" id="view-job" hidden>
      <div class="jdetail">
        <header class="jdetail__head">
          <button class="jdetail__back" id="job-back" type="button" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <span class="jdetail__htitle" id="job-htitle">岗位详情</span>
        </header>
        <div class="jdetail__body" id="job-body"></div>
        <a class="jdetail__cta" id="job-cta" target="_blank" rel="noreferrer">去 BOSS 直聘投递</a>
      </div>
    </section>

    <!-- ── Career：职能地图（S1 产物，scripts/build_careers.py 生成） ── -->
    <section class="view view--career" id="view-career" hidden>
      <div class="placeholder">
        <p class="placeholder__note">还没跑过 S1，去项目根跑一次 build_careers.py</p>
      </div>
    </section>

    <!-- ── Me：登录 / 账号 / token 用量 ── -->
    <section class="view view--center" id="view-me" hidden>
      <div class="me" id="me-body"></div>
    </section>

  </main>


</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
